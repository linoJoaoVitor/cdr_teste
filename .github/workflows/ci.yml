name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
  docker-mariadb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.docker.example .env
      - run: printf '\nAPP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> .env
      - run: docker compose up -d --build
      - run: docker compose exec -T app php artisan migrate --force
      - run: docker compose exec -T app php artisan test --configuration=phpunit.mariadb.xml --compact
      - run: curl --fail http://localhost:8080/entrar
