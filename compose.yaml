services:
  db:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?defina DB_DATABASE no .env}
      MARIADB_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  app:
    build: .
    image: cdr-teste:local
    user: '33:33'
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cdr_storage:/var/www/html/storage
    restart: unless-stopped

  worker:
    image: cdr-teste:local
    user: '33:33'
    env_file: .env
    command: ['php', 'artisan', 'queue:work', '--tries=1', '--timeout=3600', '--sleep=3']
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cdr_storage:/var/www/html/storage
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mariadb_data:
  cdr_storage:
